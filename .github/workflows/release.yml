name: Release to npm

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect changed packages
        id: detect
        run: |
          CHANGED=""
          for SPEC in "@fsdx/tiptap-table-plus:packages/tiptap-table-plus" "@fsdx/editor:packages/editor"; do
            NAME="${SPEC%%:*}"
            DIR="${SPEC##*:}"
            VERSION=$(node -p "require('./${DIR}/package.json').version")
            PUBLISHED=$(pnpm view "${NAME}" version 2>/dev/null || true)
            echo "${NAME}: local=${VERSION} published=${PUBLISHED}"
            if [ -z "${PUBLISHED}" ] || [ "${VERSION}" != "${PUBLISHED}" ]; then
              CHANGED="${CHANGED} ${NAME}"
            fi
          done
          echo "changed=${CHANGED}" >> "$GITHUB_OUTPUT"

      - name: No version change, skip publish
        if: steps.detect.outputs.changed == ''
        run: echo "没有包版本与 npm 不一致，跳过发布"

      - name: Build tiptap-table-plus
        if: steps.detect.outputs.changed != ''
        run: pnpm --filter @fsdx/tiptap-table-plus build

      - name: Build editor
        if: steps.detect.outputs.changed != '' && contains(steps.detect.outputs.changed, '@fsdx/editor')
        run: pnpm --filter @fsdx/editor build

      - name: Lint check
        if: steps.detect.outputs.changed != ''
        run: pnpm exec biome check .

      - name: Test
        if: steps.detect.outputs.changed != ''
        run: pnpm test

      - name: Publish @fsdx/tiptap-table-plus
        if: steps.detect.outputs.changed != '' && contains(steps.detect.outputs.changed, '@fsdx/tiptap-table-plus')
        run: pnpm --filter @fsdx/tiptap-table-plus publish --no-git-checks --access public

      - name: Publish @fsdx/editor
        if: steps.detect.outputs.changed != '' && contains(steps.detect.outputs.changed, '@fsdx/editor')
        run: pnpm --filter @fsdx/editor publish --no-git-checks --access public
