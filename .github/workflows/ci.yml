name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build tiptap-table-plus
        run: pnpm --filter @easyx/tiptap-table-plus build

      - name: Lint check
        run: pnpm exec biome check .

      - name: Test
        run: pnpm test
